<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Golden Hour Face Oil — view 2">
<defs>
  <linearGradient id="bdgolden-hour-oil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EEE5D4"/><stop offset=".72" stop-color="#DFCFB5"/>
    <stop offset="1" stop-color="#D4C5AC"/>
  </linearGradient>
  <radialGradient id="poolgolden-hour-oil" cx=".32" cy=".16" r=".85">
    <stop offset="0" stop-color="#F7F3EC" stop-opacity=".85"/>
    <stop offset=".55" stop-color="#F7F3EC" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="viggolden-hour-oil" cx=".5" cy=".46" r=".8">
    <stop offset=".6" stop-color="#4A3B2C" stop-opacity="0"/>
    <stop offset="1" stop-color="#4A3B2C" stop-opacity=".12"/>
  </radialGradient>
  <filter id="graingolden-hour-oil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
  </filter>
</defs>
<rect width="800" height="1000" fill="url(#bdgolden-hour-oil)"/>
<rect width="800" height="1000" fill="url(#poolgolden-hour-oil)"/>
<rect width="800" height="1000" fill="url(#viggolden-hour-oil)"/>
<defs>
