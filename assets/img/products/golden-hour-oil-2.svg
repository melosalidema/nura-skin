    <stop offset=".3" stop-color="#314438"/>
    <stop offset=".7" stop-color="#24382B"/>
    <stop offset="1" stop-color="#19271E"/>
  </linearGradient>
  <linearGradient id="lidgolden-hour-oil" x1="0" y1="0" x2="1" y2="0">
